    about: A task runner for CigScript projects; its own issues are there.
  - name: A security problem
    url: https://github.com/otmof-ops/cig-compile/blob/main/SECURITY.md
    about: Please don't open a public issue for a vulnerability; SECURITY.md says where to send it.
  - name: The guides
    url: https://github.com/otmof-ops/cig-compile/tree/main/docs
    about: Getting started, commands, shipping, how it works, troubleshooting.
