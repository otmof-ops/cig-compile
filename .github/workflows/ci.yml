name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run. A push to main (or a tag) finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only change (docs/** and *.md where the job does not build or test docs) skips the heavy
  # jobs: the macOS and Windows test matrices, the repro and probe matrices, the burns, the Docker
  # images that prove `portable`, the cross-build fan-out, and so on. The Linux `test` job still
  # runs (it tests cargo doctests and the README examples). One `ci-ok` verdict always reports.
  # Plain `git`, no third-party action.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      test_oses: ${{ steps.filter.outputs.test_oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: are any non-docs paths touched
        env:
          GH_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$GH_EVENT" in
            pull_request)
              base="$BASE_SHA"
              git fetch --no-tags --prune --depth=50 origin "+refs/heads/*:refs/remotes/origin/*" >/dev/null 2>&1 || true
              files=$(git diff --name-only "$base"...HEAD)
              ;;
            *)
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                files=$(git diff --name-only HEAD^ HEAD)
              else
                files=$(git ls-tree -r --name-only HEAD)
              fi
              ;;
          esac
          echo "changed files:"
          printf '%s\n' "$files"
          code_changed=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md) ;;
              *) code_changed=true; break ;;
            esac
          done <<EOF
          $files
          EOF
          if [ "$code_changed" = true ]; then
            test_oses='["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]'
          else
            test_oses='["ubuntu-latest"]'
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "test_oses=$test_oses" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed"
          echo "test_oses=$test_oses"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_oses) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The scripts the differential suite compares come from the CigScript
      # the compiler pins: one source, Cargo.toml.
      - name: the pinned CigScript
        shell: bash
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-orchestrator
          path: cigo-src
      # 100 generated programs ride along, from a fixed seed so a pull
      # request's run repeats; differential-random.yml takes a new seed nightly.
      - name: the differential suite (#7)
        shell: bash
        run: DIFF_RANDOM=1:100 CIGSCRIPT_SRC="$PWD/cigscript-src" cargo test --release --test differential
      - name: the budgets stage A can meet (#14)
        shell: bash
        # On Linux the runtime built here links glibc, so cig's static
        # release is fetched and measured (#27).
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --release --bin cigcompile -- bench --runs 3 --budgets --orchestrate cigo-src/orchestrate.cig
  # #9: the same inputs give the same bytes on every machine. Each runner
  # builds one script for all six machines, by a path of its own, with
  # cig's releases as the runtimes: the compiler is run alone, so no
  # runtime built here is found. `reproducible` compares the five, and runs
  # even when one of them failed, so a missing machine fails it.
  repro:
    name: one script for every machine, on ${{ matrix.os }} (#9)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --bin cigcompile
      - name: build and hash
        shell: bash
        env:
          # cig's fetcher asks GitHub for the release, and anonymous
          # requests from a shared runner can be rate-limited.
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in Windows) exe=".exe" ;; *) exe="" ;; esac
          w="$RUNNER_TEMP/repro"
          mkdir -p "$w/bin" "$w/src" "$w/out"
          cp "target/release/cigcompile$exe" "$w/bin/"
          export CIGSCRIPT_HOME="$w/home"
          printf 'exhale "the same bytes"\n' > "$w/src/same.cig"
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            "$w/bin/cigcompile$exe" build "$w/src/same.cig" --target "$t" -o "$w/out/$t"
          done
          py=$(command -v python3 || command -v python)
          "$py" -c 'import hashlib, os, sys; d = sys.argv[1]; print("\n".join(hashlib.sha256(open(os.path.join(d, f), "rb").read()).hexdigest() + "  " + f for f in sorted(os.listdir(d))))' "$w/out" | tr -d '\r' | tee "sha256-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.os }}
          path: sha256-${{ matrix.os }}.txt

  reproducible:
    name: the same bytes on five machines (#9)
    needs: [changes, repro]
    if: needs.changes.outputs.code_changed == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true
      - name: compare
        run: |
          # shellcheck disable=SC2012
          n=$(ls sha256-*.txt | wc -l)
          [ "$n" -eq 5 ] || { echo "$n machines' hashes, not five"; exit 1; }
          # shellcheck disable=SC2012
          first=$(ls sha256-*.txt | head -1)
          [ "$(wc -l < "$first")" -eq 6 ] || { echo "not six programs:"; cat "$first"; exit 1; }
          for f in sha256-*.txt; do
            diff -u "$first" "$f" || { echo "$f differs from $first"; exit 1; }
          done
          echo "five machines built the same six programs, byte for byte:"
          cat "$first"

  # #7: CigScript's portability probe (the kernel's promises, one scenario
  # each), run twice: through cig, then with every script built into a
  # program (ci/cig-compiled.sh). Every scenario must say the same.
  probe:
    name: the portability probe, compiled (${{ matrix.os }}) (#7)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: the pinned CigScript
        shell: bash
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - name: musl C toolchain (cig 1.21.0 builds C on musl, zstd and mimalloc)
        if: runner.os == 'Linux'
        run: |
          # Canonical's names can stop resolving for hours (2026-11-11: the runner's mirror list and
          # archive.ubuntu.com alike, while public resolvers still answered). Each try is time-bound; after
          # a failed one apt goes to the main archive, and a name this runner cannot resolve is pinned in
          # /etc/hosts from DNS over HTTPS to 1.1.1.1, which needs no lookup. apt still checks signatures.
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends musl-tools; then
              break
            fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ] && grep -q 'mirror+file:' "$f"; then
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$f"
                echo "apt: $f now uses archive.ubuntu.com"
              fi
            done
            for h in archive.ubuntu.com security.ubuntu.com; do
              if ! getent hosts "$h" >/dev/null; then
                ip=$(curl -fsS --max-time 10 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$h&type=A" \
                  | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)
                if [ -n "$ip" ]; then
                  echo "$ip $h" | sudo tee -a /etc/hosts >/dev/null
                  echo "apt: $h pinned to $ip"
                fi
              fi
            done
            sleep $((i * 15))
          done
      # A static runtime on Linux, as cig's release is (#27).
      - name: build
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            rustup target add x86_64-unknown-linux-musl
            cargo build --release --target x86_64-unknown-linux-musl
            echo "BIN=$PWD/target/x86_64-unknown-linux-musl/release" >> "$GITHUB_ENV"
          else
            cargo build --release
            echo "BIN=$PWD/target/release" >> "$GITHUB_ENV"
          fi
      - name: interpreted, then compiled
        shell: bash
        run: |
          rt="$BIN/cig-runtime"
          cc="$BIN/cigcompile"
          probe=cigscript-src/tests/portability/probe.sh
          CIG="$rt" bash "$probe" > interpreted.txt 2>&1 || true
          CIG="$PWD/ci/cig-compiled.sh" CIG_REAL="$rt" CIGCOMPILE="$cc" CIG_PROGRAMS="$RUNNER_TEMP/progs" \
            bash "$probe" > compiled.txt 2>&1 || true
          cat compiled.txt
          # Each scenario's verdict and name; the detail after them is the
          # last output, which may name a program where cig names a script.
          grep -E '^(PASS|FAIL|SKIP) ' interpreted.txt | cut -c1-51 > a.txt
          grep -E '^(PASS|FAIL|SKIP) ' compiled.txt | cut -c1-51 > b.txt
          n=$(wc -l < a.txt)
          [ "$n" -ge 30 ] || { echo "the probe ran $n scenarios"; cat interpreted.txt; exit 1; }
          diff -u a.txt b.txt
          echo "all $n scenarios say the same compiled as interpreted"

  # #6: CigScript's own burn tests with every script compiled. Its test
  # helpers start cig through CIG_TEST_BIN (cig-script 1.17.1), here a cig
  # that builds each script with this cigcompile and runs the program
  # (ci/cig-compiled.sh); every other command is the runtime's own cig.
  # pack, hops and wall run whole; of the CLI suite, the tin, seal, ledger,
  # box and unburn tests, but those whose subject is the interpreter's own
  # command line (a pinned script handed to another cig, a crash report's
  # argv, golden text that names `cig run`).
  burns:
    name: CigScript's burn tests, compiled (${{ matrix.os }}) (#6)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: the pinned CigScript
        shell: bash
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - name: build
        shell: bash
        run: |
          cargo build --release
          echo "BIN=$PWD/target/release" >> "$GITHUB_ENV"
      - name: pack, hops, wall, and the CLI's tin and box tests
        shell: bash
        working-directory: cigscript-src
        run: |
          export CIG_TEST_BIN="$GITHUB_WORKSPACE/ci/cig-compiled.sh"
          export CIG_REAL="$BIN/cig-runtime" CIGCOMPILE="$BIN/cigcompile"
          export CIG_PROGRAMS="$RUNNER_TEMP/progs"
          cargo test --test pack --test hops --test wall
          cargo test --test cli -- tin seal ledger box unburn journal \
            --skip a_pinned_script --skip crash_report --skip repro --skip report_bundles \
            --skip a_report_never --skip corpus_diagnoses --skip usage_layer --skip identical_plans

  # #27: a plain cargo build links this machine's glibc, and its programs
  # must not. Built here with no runtime given, a program is static and runs
  # in Debian 12 and Alpine, whose glibc is older or absent.
  portable:
    name: a source build's programs run on any Linux (#27)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release
      - name: build with no runtime given, then run in debian:12 and alpine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'exhale "hello from a program"\n' > hello.cig
          ./target/release/cigcompile build hello.cig -o hello | tee build.txt
          grep -q 'for x86_64-unknown-linux-musl)' build.txt
          file hello
          if file hello | grep -q 'dynamically linked'; then echo "the program is dynamically linked"; exit 1; fi
          for image in debian:12 alpine:3.20; do
            out=$(docker run --rm -e CIG_SEAL_KEY=file -v "$PWD:/w" -w /w "$image" ./hello)
            echo "$image: $out"
            [ "$out" = "hello from a program" ]
          done
      # #41: the same program as an OCI image, a scratch image of one file.
      - name: --emit oci, loaded and run with nothing else in the image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          printf 'stick who = args.get(0, "nobody")\nexhale "hello from a scratch image, ${who}"\n' > img.cig
          ./target/release/cigcompile build img.cig --emit oci
          docker load -i img.oci.tar
          out=$(docker run --rm -e CIG_SEAL_KEY=file localhost/img:latest Ada)
          echo "$out"
          [ "$out" = "hello from a scratch image, Ada" ]

  nothing-installed:
    name: nothing installed (#5)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - name: the pinned CigScript
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - name: musl C toolchain (cig 1.21.0 builds C on musl, zstd and mimalloc)
        run: |
          # Canonical's names can stop resolving for hours (2026-11-11: the runner's mirror list and
          # archive.ubuntu.com alike, while public resolvers still answered). Each try is time-bound; after
          # a failed one apt goes to the main archive, and a name this runner cannot resolve is pinned in
          # /etc/hosts from DNS over HTTPS to 1.1.1.1, which needs no lookup. apt still checks signatures.
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends musl-tools; then
              break
            fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ] && grep -q 'mirror+file:' "$f"; then
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$f"
                echo "apt: $f now uses archive.ubuntu.com"
              fi
            done
            for h in archive.ubuntu.com security.ubuntu.com; do
              if ! getent hosts "$h" >/dev/null; then
                ip=$(curl -fsS --max-time 10 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$h&type=A" \
                  | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)
                if [ -n "$ip" ]; then
                  echo "$ip $h" | sudo tee -a /etc/hosts >/dev/null
                  echo "apt: $h pinned to $ip"
                fi
              fi
            done
            sleep $((i * 15))
          done
      - run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - run: bash ci/nothing-installed.sh cigscript-src target/x86_64-unknown-linux-musl/release

  # #10: one Linux runner builds for every machine cig ships for, from
  # cig's own release assets (fetched, and held to the sha256 this
  # compiler pins), and each program runs on its own machine.
  cross:
    name: one runner builds for every machine (#10)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: the pinned CigScript
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - run: cargo build --release --bin cigcompile
      - name: hello and tidy-downloads for every machine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin universal2-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            ext=""; case "$t" in *windows*) ext=".exe" ;; esac
            target/release/cigcompile build cigscript-src/examples/hello.cig --target "$t" -o "out/$t/hello$ext"
            target/release/cigcompile build cigscript-src/examples/tidy-downloads.cig --target "$t" -o "out/$t/tidy$ext"
          done
          file out/*/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: out

  cross-run:
    name: runs on its own machine (${{ matrix.target }})
    needs: [changes, cross]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: out
      - name: run them
        shell: bash
        run: |
          ext=""; case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          export CIGSCRIPT_HOME="$RUNNER_TEMP/cig" NO_COLOR=1 CIG_SEAL_KEY=file CIG_REPORTS=never CIG_DOCTOR=0
          # A Mac runs its own programs and the universal ones (#10).
          dirs="${{ matrix.target }}"
          case "${{ matrix.target }}" in *apple-darwin) dirs="$dirs universal2-apple-darwin" ;; esac
          for t in $dirs; do
            d="$PWD/out/$t"
            chmod +x "$d"/* 2>/dev/null || true
            got=$("$d/hello$ext" Ada | tr -d '\r')
            [ "$got" = "hello, Ada" ] || { echo "$t hello said: $got"; exit 1; }
            rm -rf "w-$t" && mkdir -p "w-$t/downloads"
            (cd "w-$t"
             echo 1 > downloads/a.jpg; echo 2 > downloads/b.pdf; echo 3 > downloads/c.weird
             "$d/tidy$ext" downloads
             test -f downloads/image/a.jpg && test -f downloads/doc/b.pdf && test -f downloads/other/c.weird)
            echo "the $t programs ran on ${{ matrix.target }}"
          done

  # The one verdict every pull request reports: did every needed job pass or skip.
  ci-ok:
    name: ci
    if: always()
    needs: [changes, test, repro, reproducible, probe, burns, portable, nothing-installed, cross, cross-run]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | map(.key) | join(" ")')
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
          echo "every needed job passed or was skipped"
