name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The scripts the differential suite compares come from the CigScript
      # the compiler pins: one source, Cargo.toml.
      - name: the pinned CigScript
        shell: bash
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-orchestrator
          path: cigo-src
      # 100 generated programs ride along, from a fixed seed so a pull
      # request's run repeats; differential-random.yml takes a new seed nightly.
      - name: the differential suite (#7)
        shell: bash
        run: DIFF_RANDOM=1:100 CIGSCRIPT_SRC="$PWD/cigscript-src" cargo test --release --test differential
      - name: the budgets stage A can meet (#14)
        shell: bash
        run: cargo run --release --bin cigcompile -- bench --runs 3 --budgets --orchestrate cigo-src/orchestrate.cig
  # #9: the same inputs give the same bytes on every machine. Each runner
  # builds one script for all six machines, by a path of its own, with
  # cig's releases as the runtimes: the compiler is run alone, so no
  # runtime built here is found. `reproducible` compares the five, and runs
  # even when one of them failed, so a missing machine fails it.
  repro:
    name: one script for every machine, on ${{ matrix.os }} (#9)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bin cigcompile
      - name: build and hash
        shell: bash
        env:
          # cig's fetcher asks GitHub for the release, and anonymous
          # requests from a shared runner can be rate-limited.
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in Windows) exe=".exe" ;; *) exe="" ;; esac
          w="$RUNNER_TEMP/repro"
          mkdir -p "$w/bin" "$w/src" "$w/out"
          cp "target/release/cigcompile$exe" "$w/bin/"
          export CIGSCRIPT_HOME="$w/home"
          printf 'exhale "the same bytes"\n' > "$w/src/same.cig"
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            "$w/bin/cigcompile$exe" build "$w/src/same.cig" --target "$t" -o "$w/out/$t"
          done
          py=$(command -v python3 || command -v python)
          "$py" -c 'import hashlib, os, sys; d = sys.argv[1]; print("\n".join(hashlib.sha256(open(os.path.join(d, f), "rb").read()).hexdigest() + "  " + f for f in sorted(os.listdir(d))))' "$w/out" | tr -d '\r' | tee "sha256-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.os }}
          path: sha256-${{ matrix.os }}.txt

  reproducible:
    name: the same bytes on five machines (#9)
    needs: repro
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true
      - name: compare
        run: |
          n=$(ls sha256-*.txt | wc -l)
          [ "$n" -eq 5 ] || { echo "$n machines' hashes, not five"; exit 1; }
          first=$(ls sha256-*.txt | head -1)
          [ "$(wc -l < "$first")" -eq 6 ] || { echo "not six programs:"; cat "$first"; exit 1; }
          for f in sha256-*.txt; do
            diff -u "$first" "$f" || { echo "$f differs from $first"; exit 1; }
          done
          echo "five machines built the same six programs, byte for byte:"
          cat "$first"

  # #7: CigScript's portability probe (the kernel's promises, one scenario
  # each), run twice: through cig, then with every script built into a
  # program (ci/cig-compiled.sh). Every scenario must say the same.
  probe:
    name: the portability probe, compiled (${{ matrix.os }}) (#7)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the pinned CigScript
        shell: bash
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - run: cargo build --release
      - name: interpreted, then compiled
        shell: bash
        run: |
          rt="$PWD/target/release/cig-runtime"
          cc="$PWD/target/release/cigcompile"
          probe=cigscript-src/tests/portability/probe.sh
          CIG="$rt" bash "$probe" > interpreted.txt 2>&1 || true
          CIG="$PWD/ci/cig-compiled.sh" CIG_REAL="$rt" CIGCOMPILE="$cc" CIG_PROGRAMS="$RUNNER_TEMP/progs" \
            bash "$probe" > compiled.txt 2>&1 || true
          cat compiled.txt
          # Each scenario's verdict and name; the detail after them is the
          # last output, which may name a program where cig names a script.
          grep -E '^(PASS|FAIL|SKIP) ' interpreted.txt | cut -c1-51 > a.txt
          grep -E '^(PASS|FAIL|SKIP) ' compiled.txt | cut -c1-51 > b.txt
          n=$(wc -l < a.txt)
          [ "$n" -ge 30 ] || { echo "the probe ran $n scenarios"; cat interpreted.txt; exit 1; }
          diff -u a.txt b.txt
          echo "all $n scenarios say the same compiled as interpreted"

  nothing-installed:
    name: nothing installed (#5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: the pinned CigScript
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: bash ci/nothing-installed.sh cigscript-src target/x86_64-unknown-linux-musl/release

  # #10: one Linux runner builds for every machine cig ships for, from
  # cig's own release assets (fetched, and held to the sha256 this
  # compiler pins), and each program runs on its own machine.
  cross:
    name: one runner builds for every machine (#10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the pinned CigScript
        run: echo "CIGSCRIPT_REF=$(sed -nE 's/^cigscript = \{ git = "[^"]+", (tag|branch) = "([^"]+)".*/\2/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: otmof-ops/cig-script
          ref: ${{ env.CIGSCRIPT_REF }}
          path: cigscript-src
      - run: cargo build --release --bin cigcompile
      - name: hello and tidy-downloads for every machine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin universal2-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            ext=""; case "$t" in *windows*) ext=".exe" ;; esac
            target/release/cigcompile build cigscript-src/examples/hello.cig --target "$t" -o "out/$t/hello$ext"
            target/release/cigcompile build cigscript-src/examples/tidy-downloads.cig --target "$t" -o "out/$t/tidy$ext"
          done
          file out/*/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: out

  cross-run:
    name: runs on its own machine (${{ matrix.target }})
    needs: cross
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: out
      - name: run them
        shell: bash
        run: |
          ext=""; case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          export CIGSCRIPT_HOME="$RUNNER_TEMP/cig" NO_COLOR=1 CIG_SEAL_KEY=file CIG_REPORTS=never CIG_DOCTOR=0
          # A Mac runs its own programs and the universal ones (#10).
          dirs="${{ matrix.target }}"
          case "${{ matrix.target }}" in *apple-darwin) dirs="$dirs universal2-apple-darwin" ;; esac
          for t in $dirs; do
            d="$PWD/out/$t"
            chmod +x "$d"/* 2>/dev/null || true
            got=$("$d/hello$ext" Ada | tr -d '\r')
            [ "$got" = "hello, Ada" ] || { echo "$t hello said: $got"; exit 1; }
            rm -rf "w-$t" && mkdir -p "w-$t/downloads"
            (cd "w-$t"
             echo 1 > downloads/a.jpg; echo 2 > downloads/b.pdf; echo 3 > downloads/c.weird
             "$d/tidy$ext" downloads
             test -f downloads/image/a.jpg && test -f downloads/doc/b.pdf && test -f downloads/other/c.weird)
            echo "the $t programs ran on ${{ matrix.target }}"
          done

