<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="CigCompile: CigScript scripts become programs that run with nothing installed, on every machine cig is released for. A CigScript tool.">
  <title>CigCompile</title>
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="paper-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <style>
    .word { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 66px; font-weight: 700; letter-spacing: -2px; }
    .tag { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 31px; fill: #d1d5db; }
    .sub { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; fill: #9ca3af; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; fill: #9ca3af; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#f97316"/>
  <g transform="translate(64 100) scale(1.9)">

  <!-- smoke: the script, alight -->
  <g fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <path d="M 30 78 C 20 68, 42 60, 30 50"/>
    <path d="M 38 76 C 50 66, 28 60, 40 46"/>
    <path d="M 22 80 C 12 72, 24 64, 18 54"/>
  </g>
  <!-- the stick: paper, filter, ember -->
  <rect x="30" y="86" width="58" height="20" rx="5" fill="url(#paper)" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="86" y="86" width="26" height="20" rx="5" fill="#d6b370"/>
  <rect x="89" y="90" width="20" height="3" fill="#c8a25f" opacity="0.6"/>
  <rect x="89" y="99" width="20" height="3" fill="#c8a25f" opacity="0.6"/>
  <circle cx="30" cy="96" r="17" fill="#f97316" opacity="0.14"/>
  <circle cx="30" cy="96" r="11" fill="url(#ember)"/>
  <!-- into the pack -->
  <g fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 122 88 L 130 96 L 122 104" opacity="0.35"/>
    <path d="M 134 88 L 142 96 L 134 104" opacity="0.65"/>
    <path d="M 146 88 L 154 96 L 146 104"/>
  </g>
  <!-- the program: a sealed pack, the runtime and the script in one -->
  <rect x="164" y="48" width="66" height="80" rx="8" fill="url(#paper-up)" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="164" y="48" width="66" height="20" rx="7" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="164" y="92" width="66" height="12" fill="#f97316" opacity="0.9"/>
  <circle cx="197" cy="68" r="9" fill="#f97316"/>
  <path d="M 192.5 68 L 196 71.5 L 202 64.5" fill="none" stroke="#fff7ed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  <text x="540" y="232" class="word" fill="#9ca3af">Cig<tspan fill="#f97316">Compile</tspan></text>
  <text x="544" y="284" class="tag">programs that run with nothing installed</text>
  <text x="544" y="330" class="sub">a CigScript tool: the same burns, plan, journal</text>
  <text x="544" y="362" class="sub">and rollback as cig run, byte for byte</text>
  <text x="120" y="470" class="sub">one program for every machine cig is released for</text>
  <rect x="120" y="498" width="90" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="165.0" y="523" text-anchor="middle" class="chip">linux</text><rect x="222" y="498" width="90" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="267.0" y="523" text-anchor="middle" class="chip">macos</text><rect x="324" y="498" width="114" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="381.0" y="523" text-anchor="middle" class="chip">windows</text><rect x="450" y="498" width="114" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="507.0" y="523" text-anchor="middle" class="chip">freebsd</text><rect x="576" y="498" width="102" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="627.0" y="523" text-anchor="middle" class="chip">x86_64</text><rect x="690" y="498" width="114" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="747.0" y="523" text-anchor="middle" class="chip">aarch64</text><rect x="816" y="498" width="66" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="849.0" y="523" text-anchor="middle" class="chip">arm</text><rect x="894" y="498" width="150" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="969.0" y="523" text-anchor="middle" class="chip">universal2</text>
</svg>
