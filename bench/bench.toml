setup = ["sh", "gen-script.sh", "10000", "generated/passes/ten-thousand.cig"]
run   = ["cigcompile", "build", "generated/passes/ten-thousand.cig", "--emit", "cir", "--passes", "fold-consts", "-o", "generated/passes/fold-consts"]
