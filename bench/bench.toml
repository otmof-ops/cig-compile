# The benchmark manifest for cigcompile (#68), in the shape cig-script's
# docs/BENCH.md defines. `cigcompile bench --manifest bench/bench.toml` is a
# front end of it; so is `cig bench bench/bench.toml` with `cigcompile` and the
# runtime on the PATH. Run it from the repository root:
#
#     cigcompile bench --manifest bench/bench.toml --group programs
#     cigcompile bench --manifest bench/bench.toml --timings
#     cigcompile bench --manifest bench/bench.toml --group programs --syscalls
#
# What is measured, by group (the issue's six):
#
#   build      `build` of hello, of the whole set, an incremental rebuild with
#              nothing changed, and -O0, -O1, -O2: wall, rss and, with
#              `--timings`, the phases (read, index, check, pin, runtime,
#              assemble, hash, write) from CIG_TIMINGS_FD
#   programs   each program of the set, interpreted (`cig run`) and compiled,
#              the two on the same runtime (set.sha256, prep-program.sh): wall,
#              rss and, with `--syscalls`, the calls: a gap that is the
#              allocator's is named `allocator, not the compiler`
#   start-up   a compiled hello, and the interpreter's
#   size       the file a build writes, for hello, a small program and cigo-sized
#              script work (`file:`), reported against #14's 4 MB budget, not gated
#   artefacts  `--sbom`, `--sign`, `--emit oci`, `--emit deb`, `verify`, `audit`
#   passes     each pass alone, on a generated 10,000-line script (`--passes`)
#
# The set is cig's `bench/compute`, copied by set.sh after every file's sha256
# is held to set.sha256 (the pinned cig's own); it is not kept here. Timings are
# reported, never gated (DECISIONS 1); #14's budgets stay in `cigcompile bench
# --budgets`.
#
# Not here yet:
#
#   build --watch reacting to one change   a case cannot wait on a process that
#                                          never ends; `cigcompile bench --watch`
#                                          (cig bench --watch) is the live mode
#   build of orchestrate.cig (#14, 10 s)   needs a cig-orchestrator checkout;
#                                          `cigcompile bench --orchestrate` keeps it
#   a program refusing (E1050 to E1055)    waits on a fixture per refusal
#   the IR's size before and after a pass  waits on a `cig bench` measure for it;
#                                          `build --emit cir` prints the IR
#   size gated at 4 MB                     waits on stage B (#31) trimming the runtime

format = 1

[bench]
product = "cigcompile"
version = ["cigcompile", "--version"]
home    = "isolated"
build   = ["cargo", "build", "--release", "--locked", "--bins"]
binary  = "target/release/cigcompile"
watch   = ["src/**", "Cargo.toml", "bench/**"]

[defaults]
samples = 5
per     = 1
warmup  = 1
# The harness starts every case from an empty environment, so the pinned cig's
# checkout is named here, relative to this folder (the sibling `../../CigScript`
# is where CI puts it).
env     = { NO_COLOR = "1", CIG_DOCTOR = "0", CIG_SEAL_KEY = "file", CIGSCRIPT_SRC = "../../CigScript" }

# ----- build ------------------------------------------------------------------

[[case]]
name  = "build: hello"
group = "build"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/hello.cig", "-o", "generated/out/hello"]
expect = { exit = 0 }

[[case]]
name  = "build: the set"
group = "build"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set", "-o", "generated/out/all"]
expect = { exit = 0 }

[[case]]
name  = "build: nothing changed since the last build"
group = "build"
setup = ["sh", "set.sh", "generated/set"]
before = ["cigcompile", "build", "generated/set/fib.cig", "-o", "generated/out/again"]
run   = ["cigcompile", "build", "generated/set/fib.cig", "-o", "generated/out/again"]
expect = { exit = 0 }

[[case]]
name  = "build: fib at -O0"
group = "build"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/fib.cig", "-O0", "-o", "generated/out/o0"]
expect = { exit = 0 }

[[case]]
name  = "build: fib at -O1"
group = "build"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/fib.cig", "-O1", "-o", "generated/out/o1"]
expect = { exit = 0 }

[[case]]
name  = "build: fib at -O2"
group = "build"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/fib.cig", "-O2", "-o", "generated/out/o2"]
expect = { exit = 0 }

# ----- programs: each compiled against the same script interpreted -------------
# Both sides run the runtime in set.sha256's cig-compatible build: the program
# is built on the `cig` first on the PATH and `prep-program.sh` refuses unless
# `cigcompile verify` finds those exact bytes in it. same.sh holds each side's
# output to cig's own .expect file.

[[case]]
name  = "interpreted: closures"
group = "programs"
setup = ["sh", "set.sh", "generated/set"]
run   = ["sh", "same.sh", "interpreted", "closures"]
expect = { exit = 0 }

[[case]]
name  = "compiled: closures"
group = "programs"
setup = ["sh", "-c", "sh set.sh generated/set && sh prep-program.sh closures generated/prog"]
run   = ["sh", "same.sh", "compiled", "closures"]
expect = { exit = 0 }

