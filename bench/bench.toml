# ----- start-up ---------------------------------------------------------------

[[case]]
name  = "compiled: hello, start-up"
group = "start-up"
setup = ["sh", "-c", "sh set.sh generated/set && sh prep-program.sh hello generated/prog"]
run   = ["generated/prog/hello"]
per   = 20
expect = { exit = 0 }

[[case]]
name  = "interpreted: hello, start-up"
group = "start-up"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cig", "run", "generated/set/hello.cig"]
per   = 20
expect = { exit = 0 }

# ----- size: the file a build writes (reported; #14's 4 MB waits on stage B) ---

[[case]]
name  = "size: hello"
group = "size"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/hello.cig", "-o", "generated/size/hello"]
measure = ["wall", "file:generated/size/hello"]
expect = { exit = 0 }

[[case]]
name  = "size: nbody"
group = "size"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/nbody.cig", "-o", "generated/size/nbody"]
measure = ["wall", "file:generated/size/nbody"]
expect = { exit = 0 }

# ----- artefacts --------------------------------------------------------------

[[case]]
name  = "artefacts: --sbom"
group = "artefacts"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/hello.cig", "--sbom", "-o", "generated/art/sbom"]
expect = { exit = 0 }

[[case]]
name  = "artefacts: --sign"
group = "artefacts"
setup = ["sh", "-c", "sh set.sh generated/set && mkdir -p generated/art && rm -f generated/art/key generated/art/key.pub && ssh-keygen -q -t ed25519 -N '' -f generated/art/key"]
run   = ["cigcompile", "build", "generated/set/hello.cig", "--sign", "generated/art/key", "-o", "generated/art/signed"]
expect = { exit = 0 }

[[case]]
name  = "artefacts: --emit oci"
group = "artefacts"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/hello.cig", "--emit", "oci", "-o", "generated/art/oci"]
expect = { exit = 0 }

[[case]]
name  = "artefacts: --emit deb"
group = "artefacts"
setup = ["sh", "set.sh", "generated/set"]
run   = ["cigcompile", "build", "generated/set/hello.cig", "--emit", "deb", "-o", "generated/art/deb"]
expect = { exit = 0 }

[[case]]
name  = "artefacts: verify"
group = "artefacts"
setup = ["sh", "-c", "sh set.sh generated/set && sh prep-program.sh hello generated/prog"]
run   = ["sh", "-c", "cigcompile verify generated/prog/hello --script generated/set/hello.cig --runtime \"$(command -v cig)\""]
expect = { exit = 0 }

[[case]]
name  = "artefacts: audit"
group = "artefacts"
setup = ["sh", "-c", "sh set.sh generated/set && sh prep-program.sh hello generated/prog"]
run   = ["cigcompile", "audit", "generated/prog/hello"]
expect = { exit = 0 }

# ----- passes: each alone on a generated 10,000-line script --------------------

