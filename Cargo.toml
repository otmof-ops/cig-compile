[package]
name = "cigcompile"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "CigCompile: CigScript scripts as programs that run with nothing installed"
license = "FSL-1.1-ALv2"
repository = "https://github.com/otmof-ops/cig-compile"
publish = false
default-run = "cigcompile"

[lib]
name = "cigcompile"
path = "src/lib.rs"

[[bin]]
name = "cigcompile"
path = "src/main.rs"

# The runtime a program is appended to: `cig` itself, of the cigscript
# version this compiler pins, built in the same build.
[[bin]]
name = "cig-runtime"
path = "src/bin/cig-runtime.rs"

[features]
# A bench-only build of the runtime that counts allocations (#30):
# `cargo build --release --bin cig-runtime --features alloc-count`.
alloc-count = []

[dependencies]
cigscript = { git = "https://github.com/otmof-ops/cig-script", tag = "v1.22.0" }
# `.cigar` files and `--strength` (cigar-script#7): the checker and lowering
# that `cigar check` is, pinned the way cigscript is, to a cigar-script commit.
# The rev here is built on cigscript v1.20.0's AST and keeps its own cigscript
# copy in the graph until cigar-script rebases on the tag above; cigarscript's public
# API (Strength, Render, Prepared, experience) does not cross either cigscript.
cigarscript = { git = "https://github.com/otmof-ops/cigar-script", rev = "8275562f576b18ba568471b51028a9ee648371ae" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# gzip for `--emit deb` (already compiled in by cigscript).
flate2 = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
# wait4, for a benchmark's peak resident set (already compiled in by cigscript).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# The differential suite reports itself: one table, its own exit code.
[[test]]
name = "differential"
harness = false

# A program's build hashes its runtime twice (the record's
# `runtime_sha256`, then the program's own sha256): with a debug runtime of
# about 200 MB that is seven seconds a build in an unoptimised sha2, which
# the test suites pay on every program they build. Optimised, a fraction
# of a second; nothing else in a debug build changes.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
